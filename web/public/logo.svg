<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ft-card-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162033" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ft-slider-top" x1="45" y1="45" x2="80" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="ft-slider-mid" x1="45" y1="64" x2="68" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="ft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Devtool Card -->
  <rect x="6" y="6" width="108" height="108" rx="22" fill="url(#ft-card-bg)" stroke="#334155" stroke-width="2.5" />

  <!-- Editorial Serif Vertical Stem ('I' / 'F' Spine) -->
  <path
    d="M28 24H60V27.5C53.5 27.5 50 30.5 50 37.5V82.5C50 89.5 53.5 92.5 60 92.5V96H28V92.5C34.5 92.5 38 89.5 38 82.5V37.5C38 30.5 34.5 27.5 28 27.5V24Z"
    fill="#F8FAFC"
  />

  <!-- Top Crossbar Slider Track (Recessed Capsule) -->
  <rect x="44" y="39" width="48" height="11" rx="5.5" fill="#0B1324" stroke="#38BDF8" stroke-opacity="0.65" stroke-width="1.5" />
  <!-- Top Slider Active Fill -->
  <rect x="46.5" y="41.5" width="31" height="6" rx="3" fill="url(#ft-slider-top)" />
  <!-- Top Slider Knob -->
  <circle cx="77" cy="44.5" r="7.5" fill="#F8FAFC" stroke="#3B82F6" stroke-width="3" filter="url(#ft-glow)" />

  <!-- Middle Crossbar Slider Track (Recessed Capsule) -->
  <rect x="44" y="58.5" width="48" height="11" rx="5.5" fill="#0B1324" stroke="#22D3EE" stroke-opacity="0.65" stroke-width="1.5" />
  <!-- Middle Slider Active Fill -->
  <rect x="46.5" y="61" width="19" height="6" rx="3" fill="url(#ft-slider-mid)" />
  <!-- Middle Slider Knob -->
  <circle cx="65.5" cy="64" r="7.5" fill="#F8FAFC" stroke="#22D3EE" stroke-width="3" filter="url(#ft-glow)" />
</svg>
